<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Up</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8b800'/%3E%3Cg stroke='%23e8b800' stroke-width='2.2' stroke-linecap='round'%3E%3Cline x1='16' y1='1.5' x2='16' y2='6'/%3E%3Cline x1='16' y1='26' x2='16' y2='30.5'/%3E%3Cline x1='1.5' y1='16' x2='6' y2='16'/%3E%3Cline x1='26' y1='16' x2='30.5' y2='16'/%3E%3Cline x1='5' y1='5' x2='8.2' y2='8.2'/%3E%3Cline x1='23.8' y1='23.8' x2='27' y2='27'/%3E%3Cline x1='27' y1='5' x2='23.8' y2='8.2'/%3E%3Cline x1='8.2' y1='23.8' x2='5' y2='27'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Notem hero image palette ─────────────────────────────
         bg/surface : warm off-white table surface
         amber      : deep forest green from notebook stripes
         amber-fill : lighter green for XP bar fill
         teal       : golden yellow from the pen tray (secondary)
         green      : same forest green for completion states
         text       : near-black (Notem's own #1C1C1C)
      ────────────────────────────────────────────────────── */
      --bg:         #ede9e1;
      --surface:    #f5f2eb;
      --surface2:   #e4e0d7;
      --border:     #d4cfc3;
      --border-hl:  #aaa59a;
      --amber:      #3a5649;
      --amber-fill: #4a6858;
      --amber-lt:   rgba(58,86,73,0.08);
      --amber-ring: rgba(58,86,73,0.20);
      --teal:       #9a7c1c;
      --teal-lt:    rgba(154,124,28,0.08);
      --green:      #3a5649;
      --green-lt:   rgba(58,86,73,0.07);
      --red:        #b03428;
      --orange:     #9a7c1c;
      --text:       #1a1a1a;
      --text-dim:   #8a857a;
      --text-mid:   #504c46;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
      line-height: 1.65;
      letter-spacing: 0.01em;
    }

    /* ── TOP BAR (sticky wrapper) ────────────────────── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
    }

    /* ── HEADER ──────────────────────────────────────── */
    .header {
      background: transparent;
      border-bottom: none;
      padding: 20px 20px 14px;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .game-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--amber);
      font-family: 'Montserrat', sans-serif;
      line-height: 1;
      margin-bottom: 2px;
    }
    .hero-level-title {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.02em;
      margin-top: 1px;
    }
    .streak-pill {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-dim);
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.02em;
    }
    .xp-total { font-size: 0.67rem; color: var(--text-dim); margin-top: 2px; text-align: right; }
    .xp-bar-wrap { margin-top: 14px; }
    .xp-bar-track {
      width: 100%; height: 1px;
      background: var(--border);
      border-radius: 0;
      border: none;
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 0;
      transition: width 0.6s cubic-bezier(0.34,1.2,0.64,1);
    }
    .xp-bar-label { display: block; font-size: 0.63rem; color: var(--text-dim); margin-top: 4px; font-family: 'Montserrat', sans-serif; letter-spacing: 0.03em; }

    /* ── TABS ────────────────────────────────────────── */
    .tabs-wrap {
      display: flex;
      background: transparent;
      border-bottom: none;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 20px;
      gap: 4px;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 8px 16px 8px 0;
      background: transparent;
      border: none;
      border-bottom: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.7rem;
      font-family: 'Montserrat', sans-serif;
      white-space: nowrap;
      transition: color 0.15s;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tab:hover { color: var(--text-mid); }
    .tab.active { color: var(--text); font-weight: 700; }

    /* ── LAYOUT ──────────────────────────────────────── */
    .main { max-width: 720px; margin: 0 auto; padding: 22px 20px; }
    .section { display: none; }
    .section.active { display: block; }

    /* ── CARDS / SURFACES ────────────────────────────── */
    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      border-top: 1px solid var(--border);
      padding: 20px 0 4px;
      margin-bottom: 0;
    }
    .card-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── FIELD NOTE ──────────────────────────────────── */
    .field-note {
      background: transparent;
      border: none;
      border-left: 2px solid var(--border);
      border-radius: 0;
      padding: 2px 0 2px 16px;
      margin-bottom: 20px;
    }
    .field-note-icon { display: none; }
    .field-note-text { font-size: 0.79rem; color: var(--text-dim); line-height: 1.7; }

    /* ── ENERGY SELECTOR ─────────────────────────────── */
    .energy-row { display: flex; gap: 8px; margin: 20px 0 12px; }
    .energy-btn {
      flex: 1;
      padding: 20px 6px 16px;
      background: var(--surface);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .energy-btn:hover { background: var(--surface2); }
    .energy-btn .e-icon {
      font-size: 1.3rem;
      display: block;
      margin-bottom: 8px;
      color: var(--text-mid);
      line-height: 1;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }
    .energy-btn .e-label { font-size: 0.74rem; font-weight: 600; color: var(--text); font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em; }
    .energy-btn .e-sub { font-size: 0.62rem; color: var(--text-dim); margin-top: 3px; line-height: 1.4; }
    .rest-day-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      border-radius: 0;
      color: var(--text-dim);
      font-size: 0.76rem;
      cursor: pointer;
      transition: color 0.15s;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.02em;
    }
    .rest-day-btn:hover { color: var(--text-mid); }

    /* ── FOCUS LIST (Today tab) ───────────────────────── */
    .focus-item {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 0;
      animation: slideIn 0.18s ease;
    }
    .focus-item:hover .del-btn { opacity: 0.6; }
    .focus-item.focus-done { opacity: 0.38; }
    .focus-item.focus-done .focus-text { text-decoration: line-through; }
    .focus-text { flex: 1; font-size: 0.86rem; line-height: 1.55; color: var(--text); }

    /* ── OUTSIDE / SESSIONS ROW ──────────────────────── */
    .rhythm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 12px 0;
      margin-bottom: 0;
      cursor: pointer;
      transition: opacity 0.15s;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .rhythm-row:hover { opacity: 0.75; }
    .rhythm-row.rhythm-done { opacity: 1; }
    .rhythm-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .rhythm-icon { font-size: 1.1rem; flex-shrink: 0; }
    .rhythm-label { font-size: 0.84rem; font-weight: 500; color: var(--text); }
    .rhythm-sub { font-size: 0.7rem; color: var(--text-dim); margin-top: 1px; }
    .check-circle {
      width: 20px; height: 20px;
      border: 1.5px solid transparent;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      transition: all 0.2s;
      color: white;
      background: transparent;
    }
    .focus-item:hover .check-circle,
    .rhythm-row:hover .check-circle { border-color: var(--border-hl); }
    .check-circle.checked {
      background: var(--green);
      border-color: var(--green);
      font-size: 0.6rem;
    }
    .rhythm-done .check-circle { background: var(--green); border-color: var(--green); font-size: 0.6rem; }

    /* ── SESSION DOTS ────────────────────────────────── */
    .session-dots { display: flex; gap: 5px; align-items: center; }
    .sdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .sdot.done { background: var(--amber); }

    /* ── WIN LOG ─────────────────────────────────────── */
    .win-entry {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: none;
      font-size: 0.8rem;
    }
    .win-entry:last-child { border-bottom: none; }
    .win-date { font-size: 0.67rem; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; padding-top: 1px; }

    /* ── GREETING ────────────────────────────────────── */
    .greeting-line { font-size: 1.75rem; font-weight: 300; color: var(--text); font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em; line-height: 1.2; }
    .greeting-date { font-size: 0.74rem; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.04em; font-family: 'Montserrat', sans-serif; }

    /* ── TASKS (Quests tab) ───────────────────────────── */
    .task {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 11px 0;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 0;
      animation: slideIn 0.18s ease;
      transition: opacity 0.15s;
    }
    .task:hover { opacity: 0.75; }
    .task:hover .del-btn { opacity: 0.6; }
    .task.done { opacity: 0.38; }
    .task.done .task-text { text-decoration: line-through; }
    .task-text { flex: 1; font-size: 0.86rem; line-height: 1.4; color: var(--text); word-break: break-word; }
    .task-meta { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .xp-badge {
      font-size: 0.63rem; color: var(--text-dim);
      padding: 0; white-space: nowrap;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em;
    }
    .cat-icon { font-size: 0.82rem; opacity: 0.55; }
    .pin-btn {
      background: none; border: none;
      color: var(--text-dim); cursor: pointer;
      font-size: 0.64rem; padding: 0;
      transition: color 0.15s; white-space: nowrap;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em;
    }
    .pin-btn:hover { color: var(--amber); }
    .pin-tag { font-size: 0.66rem; color: var(--amber); white-space: nowrap; }
    .del-btn {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 0.73rem; padding: 2px 5px;
      border-radius: 4px; opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    .del-btn:hover { opacity: 1 !important; color: var(--red); }

    /* ── ADD FORM ────────────────────────────────────── */
    .add-form { display: flex; gap: 10px; margin-bottom: 0; align-items: flex-end; }
    .add-input {
      flex: 1; min-width: 0;
      background: transparent;
      border: none; border-bottom: 1px solid var(--border);
      color: var(--text); padding: 9px 0;
      border-radius: 0; font-size: 0.84rem; outline: none;
      transition: border-color 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .add-input:focus { border-bottom-color: var(--text); box-shadow: none; }
    .add-input::placeholder { color: var(--text-dim); }
    .add-btn {
      background: transparent; color: var(--text);
      border: none; width: auto; height: auto;
      padding: 9px 0 9px 4px;
      cursor: pointer;
      font-size: 1.1rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s; line-height: 1;
    }
    .add-btn:hover { opacity: 0.45; }
    .add-select {
      background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text); padding: 9px 8px 9px 0;
      border-radius: 0; font-size: 0.82rem; outline: none;
      cursor: pointer; flex-shrink: 0;
      -webkit-appearance: none; appearance: none;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── CAT TABS (Quests) ───────────────────────────── */
    .cat-tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0;
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 8px, black calc(100% - 8px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, black 8px, black calc(100% - 8px), transparent 100%);
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 0 0 10px; border-radius: 0;
      border: none; border-bottom: 2px solid transparent;
      background: transparent;
      font-size: 0.68rem; cursor: pointer; color: var(--text-dim);
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
      display: flex; align-items: center; gap: 5px;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.07em;
      text-transform: uppercase; margin-bottom: -1px;
    }
    .cat-tab:hover { color: var(--text-mid); }
    .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
    .ct-badge { font-size: 0.6rem; opacity: 0.6; }

    /* ── REJECTION BAR ───────────────────────────────── */
    .rejection-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: transparent; border: none; border-bottom: 1px solid var(--border);
      border-radius: 0; padding: 16px 0; margin-bottom: 0; gap: 10px;
    }
    .rejection-count { font-size: 1.8rem; font-weight: 200; color: var(--text); font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em; line-height: 1; }
    .rejection-label { font-size: 0.68rem; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
    .rejection-btn {
      background: transparent; border: none;
      color: var(--text-dim); padding: 0; border-radius: 0;
      cursor: pointer; font-size: 0.68rem; white-space: nowrap;
      transition: color 0.15s; flex-shrink: 0;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em;
    }
    .rejection-btn:hover { color: var(--text); }

    /* ── DONE TOGGLE ─────────────────────────────────── */
    .done-toggle {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 0.75rem;
      display: flex; align-items: center; gap: 5px; padding: 4px 0;
      margin-top: 4px;
    }
    .done-toggle:hover { color: var(--text); }

    /* ── EMPTY STATE ─────────────────────────────────── */
    .empty { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: 0.83rem; line-height: 1.5; }
    .empty-icon { font-size: 1.6rem; margin-bottom: 7px; opacity: 0.55; }

    /* ── TIMER ───────────────────────────────────────── */
    .timer-display {
      font-size: 4.5rem;
      font-weight: 100;
      text-align: center;
      color: var(--text);
      letter-spacing: -2px;
      margin: 16px 0 6px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      font-family: 'Montserrat', sans-serif;
    }
    .timer-mode-row { display: flex; gap: 24px; justify-content: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .timer-mode-btn {
      padding: 0 0 12px; border-radius: 0;
      border: none; border-bottom: 2px solid transparent;
      background: transparent; margin-bottom: -1px;
      font-size: 0.68rem; cursor: pointer; color: var(--text-dim);
      transition: color 0.15s, border-color 0.15s;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .timer-mode-btn:hover { color: var(--text-mid); }
    .timer-mode-btn.active { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
    .timer-controls { display: flex; gap: 8px; justify-content: center; }
    .timer-btn {
      padding: 11px 26px; border-radius: 9px; border: none;
      cursor: pointer; font-size: 0.875rem; font-weight: 600;
      transition: opacity 0.15s;
    }
    .timer-btn.primary { background: var(--text); color: var(--surface); }
    .timer-btn.secondary {
      background: var(--surface2); color: var(--text-mid);
      border: 1px solid var(--border);
    }
    .timer-btn:hover { opacity: 0.72; }
    .timer-task-select {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px solid var(--border); color: var(--text);
      padding: 9px 0; border-radius: 0;
      font-size: 0.83rem; outline: none;
      -webkit-appearance: none; appearance: none;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── STATS ROW ───────────────────────────────────── */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0; margin-bottom: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 20px 0; margin-bottom: 28px;
    }
    .stat-card {
      background: transparent; border: none;
      border-radius: 0; padding: 0 16px; text-align: left;
      border-right: 1px solid var(--border);
    }
    .stat-card:first-child { padding-left: 0; }
    .stat-card:last-child { border-right: none; }
    .stat-value { font-size: 2rem; font-weight: 200; color: var(--text); font-family: 'Montserrat', sans-serif; line-height: 1; letter-spacing: -0.02em; }
    .stat-label { font-size: 0.58rem; color: var(--text-dim); margin-top: 6px; line-height: 1.3; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── WEEK GRID ───────────────────────────────────── */
    .week-grid {
      display: grid; grid-template-columns: repeat(14, 1fr);
      gap: 3px; margin-bottom: 7px;
    }
    .wday {
      aspect-ratio: 1; border-radius: 3px;
      background: var(--surface2); border: none;
    }
    .wday.light   { background: rgba(58,86,73,0.20);  }
    .wday.regular { background: rgba(154,124,28,0.28); }
    .wday.full    { background: rgba(26,26,26,0.18);  }
    .wday.rest    { background: rgba(154,124,28,0.10); }
    .wday.today   { border-color: var(--text); }

    /* ── ACHIEVEMENTS ────────────────────────────────── */
    .ach-list { display: flex; flex-direction: column; }
    .ach-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
      transition: opacity 0.2s;
    }
    .ach-item.earned { opacity: 1; }
    .ach-item:last-child { border-bottom: none; }
    .ach-icon { font-size: 1rem; flex-shrink: 0; width: 20px; margin-top: 1px; }
    .ach-text-wrap { opacity: 0.45; transition: opacity 0.2s; }
    .ach-item.earned .ach-text-wrap { opacity: 1; }
    .ach-name { font-size: 0.78rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .ach-desc { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }
    .ach-item.earned .ach-name { color: var(--amber); }

    /* ── VIEW TOGGLE BUTTONS ─────────────────────────── */
    .view-toggle-btn {
      padding: 0 0 10px; border: none; border-bottom: 2px solid transparent;
      background: transparent; color: var(--text-dim); font-weight: 400;
      font-size: 0.68rem; cursor: pointer; font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .view-toggle-btn.active {
      color: var(--text); border-bottom-color: var(--text); font-weight: 700;
    }

    /* ── MODAL ───────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.42);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: none;
      border-radius: 3px; padding: 36px 32px; text-align: center;
      max-width: 340px; width: 90%;
      box-shadow: none;
      animation: popIn 0.28s cubic-bezier(0.34,1.5,0.64,1);
      max-height: 85vh; overflow-y: auto;
    }
    @keyframes popIn { from { transform: scale(0.72); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-big-icon { font-size: 2.8rem; margin-bottom: 9px; }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Montserrat', sans-serif; }
    .modal-body { font-size: 0.86rem; color: var(--text-mid); margin-bottom: 20px; line-height: 1.55; }
    .modal-btn {
      background: var(--text); color: var(--surface);
      border: none; padding: 10px 26px; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 0.875rem;
      transition: opacity 0.15s;
    }
    .modal-btn:hover { opacity: 0.72; }

    /* ── HEADER WEATHER ──────────────────────────────── */
    .header-weather {
      font-size: 0.58rem;
      color: var(--text-dim);
      margin-top: 12px;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── XP FLOAT ────────────────────────────────────── */
    .xp-float {
      position: fixed; font-weight: 700; font-size: 0.88rem;
      color: var(--amber); pointer-events: none;
      animation: floatUp 0.9s ease forwards; z-index: 300;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      40%  { opacity: 1; transform: translateY(-18px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.9); }
    }
    @keyframes fadeToast {
      0%   { opacity: 0; transform: translateX(-50%) translateY(6px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .gcal-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; border: none;
      color: var(--text-dim); padding: 0;
      cursor: pointer; font-size: 0.74rem;
      transition: color 0.15s; white-space: nowrap;
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em;
    }
    .gcal-btn:hover { color: var(--text); }
    .time-input, .dur-select {
      background: transparent; border: none; border-bottom: 1px solid var(--border);
      color: var(--text); padding: 6px 0; border-radius: 0;
      font-size: 0.78rem; outline: none; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      font-family: 'DM Sans', sans-serif;
    }
    .time-input:focus, .dur-select:focus { border-bottom-color: var(--text); }

    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 500px) {
      .header { padding: 11px 14px 10px; }
      .main { padding: 13px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .week-grid { grid-template-columns: repeat(7, 1fr); }
      .timer-display { font-size: 3.5rem; }
    }

    /* ── JOURNAL CALENDAR ────────────────────────────────── */
    .journal-cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .journal-cal-title {
      font-size: 0.74rem; font-weight: 700; font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text);
    }
    .journal-cal-nav {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 0.9rem; padding: 2px 8px; transition: color 0.15s;
      font-family: 'Montserrat', sans-serif;
    }
    .journal-cal-nav:hover { color: var(--text); }
    .journal-month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
      margin-bottom: 24px;
    }
    .journal-day-label {
      font-size: 0.56rem; text-align: center; color: var(--text-dim);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.07em;
      padding-bottom: 6px; text-transform: uppercase;
    }
    .journal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-family: 'Montserrat', sans-serif;
      border-radius: 2px; color: var(--text-dim); position: relative;
      transition: opacity 0.15s;
    }
    .journal-day.has-data { cursor: pointer; color: var(--text); }
    .journal-day.has-data:hover { opacity: 0.7; }
    .journal-day.has-data.light   { background: rgba(58,86,73,0.18); }
    .journal-day.has-data.regular { background: rgba(154,124,28,0.22); }
    .journal-day.has-data.full    { background: rgba(26,26,26,0.13); }
    .journal-day.has-data.rest    { background: rgba(154,124,28,0.09); }
    .journal-day.is-today { font-weight: 700; color: var(--text); }
    .journal-day.selected { outline: 1.5px solid var(--text); outline-offset: -1px; }
    .journal-day.sealed::after {
      content: ''; position: absolute; bottom: 2px; left: 50%;
      transform: translateX(-50%); width: 3px; height: 3px;
      border-radius: 50%; background: var(--amber);
    }
    .journal-detail-date {
      font-size: 1.2rem; font-weight: 300; font-family: 'Montserrat', sans-serif;
      letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 3px;
    }
    .journal-stats-row {
      display: flex; gap: 0;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 14px 0; margin: 16px 0 20px;
    }
    .journal-stat {
      flex: 1; padding: 0 14px;
      border-right: 1px solid var(--border);
    }
    .journal-stat:first-child { padding-left: 0; }
    .journal-stat:last-child { border-right: none; }
    .journal-stat-val {
      font-size: 1.6rem; font-weight: 200; font-family: 'Montserrat', sans-serif;
      letter-spacing: -0.02em; line-height: 1;
    }
    .journal-stat-lbl {
      font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim); margin-top: 4px; font-family: 'Montserrat', sans-serif;
    }

    /* ── PIN SCREEN ──────────────────────────────────────── */
    .pin-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000;
      flex-direction: column;
      gap: 0;
    }
    .pin-overlay.hidden { display: none; }
    .pin-app-name {
      font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700;
      letter-spacing: 0.08em; color: var(--text); margin-bottom: 6px;
      text-transform: uppercase;
    }
    .pin-prompt {
      font-size: 0.65rem; color: var(--text-dim);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.07em;
      text-transform: uppercase; margin-bottom: 36px; min-height: 1.2em;
      text-align: center;
    }
    .pin-dots {
      display: flex; gap: 14px; margin-bottom: 36px;
    }
    .pin-dot {
      width: 11px; height: 11px; border-radius: 50%;
      border: 1.5px solid var(--border-hl); background: transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .pin-dot.filled { background: var(--text); border-color: var(--text); }
    .pin-dot.error  { background: var(--red);  border-color: var(--red);  }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(4, 60px);
      gap: 6px;
    }
    .pin-key {
      width: 72px; height: 60px;
      background: none; border: none;
      font-family: 'Montserrat', sans-serif; font-size: 1.35rem; font-weight: 300;
      color: var(--text); cursor: pointer; border-radius: 3px;
      transition: background 0.1s;
    }
    .pin-key:hover  { background: var(--surface2); }
    .pin-key:active { background: var(--border); }
    .pin-key.ghost  { pointer-events: none; color: transparent; }
    .pin-key.back   { font-size: 1rem; color: var(--text-dim); }
    .pin-error-msg  {
      margin-top: 20px; font-size: 0.63rem; color: var(--red);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.06em;
      text-transform: uppercase; min-height: 1em; text-align: center;
    }
    .pin-footer {
      margin-top: 48px; font-size: 0.62rem; color: var(--text-dim);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.04em;
      text-align: center; line-height: 1.8;
    }

    /* ── DATA MANAGEMENT ─────────────────────────────────── */
    .data-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .data-row:last-child { border-bottom: none; }
    .data-action-btn {
      font-size: 0.72rem; font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.04em; padding: 7px 14px;
      background: var(--surface2); border: none;
      border-radius: 2px; cursor: pointer; color: var(--text);
      transition: background 0.15s;
    }
    .data-action-btn:hover { background: var(--border); }
    .data-action-btn.danger { color: var(--red); }
    .data-desc {
      font-size: 0.73rem; color: var(--text-dim); line-height: 1.5; flex: 1;
    }

/* ── NETWORK TAB ─────────────────────────────────────── */
.network-toolbar {

  margin-bottom: 16px; flex-wrap: wrap;
}
.network-search {
  flex: 1; min-width: 140px;

.contact-name {

}
.contact-type-badge {

}

.contact-today-btn {

function initFirebase() {
  if (FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_API_KEY_HERE') {
    console.log('Firebase not configured — running in local mode');
    return; // app already rendered with localStorage data
  }
  try {
    firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
    firebaseAuth = firebase.auth();
    firebaseDb = firebase.database();

    firebaseAuth.getRedirectResult().catch((err) => {
      console.error('Redirect result error:', err);

    firebaseAuth.onAuthStateChanged(async (user) => {
      if (user) {
        firebaseUser = user;
        hideSignInScreen();
        await loadFromFirebase();
        startFirebaseSync();
      } else {
        firebaseUser = null;
        showSignInScreen();
      }

  } catch(e) {
    console.error('Firebase init failed:', e);
    // Fall back to localStorage-only mode
    hideSignInScreen();
    render();
  }
}

  const provider = new firebase.auth.GoogleAuthProvider();
  firebaseAuth.signInWithRedirect(provider).catch((err) => {
    console.error('Sign-in error:', err);
    if (btn) { btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg> Continue with Google`; btn.disabled = false; }

function signOutUser() {

      showSignInScreen();
    });

async function loadFromFirebase() {
  if (!firebaseUser || !firebaseDb) return;
  return new Promise((resolve) => {
    firebaseDb.ref(`users/${firebaseUser.uid}/state`).once('value', (snapshot) => {
      const cloudData = snapshot.val();
      if (cloudData) {
        // Cloud has data — use it
        _syncPaused = true;
        S = Object.assign({}, DEFAULT_STATE, cloudData);
        localStorage.setItem('jhc3', JSON.stringify(S));
        _syncPaused = false;
        render();
        checkDayReset();
        resolve();
      } else {
        // No cloud data yet — check if localStorage has data to migrate
        const localRaw = localStorage.getItem('jhc3') || localStorage.getItem('jhc2');
        if (localRaw) {
          try {
            const localData = Object.assign({}, DEFAULT_STATE, JSON.parse(localRaw));
            showMigrationOffer(localData);
          } catch(e) {
            render();
            checkDayReset();
          }
        } else {
          render();
          checkDayReset();
        }
        resolve();
      }
    });
  });
}

function showMigrationOffer(localData) {
  render();
  checkDayReset();
  setTimeout(() => {
    showModal(`
      <div style="text-align:left">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:8px;font-family:'Montserrat',sans-serif;">Upload your data?</div>
        <div style="font-size:0.82rem;color:var(--text-mid);line-height:1.6;margin-bottom:20px;">We found existing Show Up data on this device. Upload it to your account so it syncs everywhere?</div>
        <div style="display:flex;gap:8px;">
          <button onclick="closeModal()" style="flex:1;padding:10px;border:none;background:var(--surface2);border-radius:2px;font-size:0.85rem;cursor:pointer;color:var(--text-mid);">Start fresh</button>
          <button onclick="closeModal();doMigrateToFirebase()" style="flex:1;padding:10px;background:var(--amber);color:#fff;border:none;border-radius:2px;font-size:0.85rem;font-weight:600;cursor:pointer;">Upload my data</button>
        </div>
      </div>
    `);
  }, 600);
  // Store for use in doMigrateToFirebase
  window._pendingMigrationData = localData;
}

function doMigrateToFirebase() {
  if (!window._pendingMigrationData || !firebaseUser || !firebaseDb) return;
  S = window._pendingMigrationData;
  window._pendingMigrationData = null;
  save();
  render();
  showToast('Data uploaded \u2713');
}

function startFirebaseSync() {
  if (!firebaseUser || !firebaseDb) return;
  // Listen for changes from other devices
  firebaseDb.ref(`users/${firebaseUser.uid}/state`).on('value', (snapshot) => {
    if (_syncPaused) return;
    const cloudData = snapshot.val();
    if (!cloudData) return;
    // Only update if the cloud version is newer (has higher nextId)
    const localNextId = S.nextId || 0;
    const cloudNextId = cloudData.nextId || 0;
    if (cloudNextId > localNextId) {
      _syncPaused = true;
      S = Object.assign({}, DEFAULT_STATE, cloudData);
      localStorage.setItem('jhc3', JSON.stringify(S));
      _syncPaused = false;
      render();
    }
  });
}

const PIN_KEY = 'showup_pin';
let pinInput  = '';
let pinStage  = 'entry';   // 'entry' | 'setup' | 'confirm'
let pinFirst  = '';

function initPin() {
  const stored = localStorage.getItem(PIN_KEY);
  const overlay = document.getElementById('pinOverlay');
  if (!stored) {
    pinStage = 'setup';
    updatePinUI('Choose a 4-digit PIN to protect your app');
    overlay.classList.remove('hidden');
  } else {
    pinStage = 'entry';
    updatePinUI('Enter your PIN');
    overlay.classList.remove('hidden');
  }
}

function pinPress(digit) {
  if (pinInput.length >= 4) return;
  pinInput += digit;
  updatePinDots();
  if (pinInput.length === 4) setTimeout(pinSubmit, 80);
}

function pinBack() {
  pinInput = pinInput.slice(0, -1);
  updatePinDots();
  document.getElementById('pinError').textContent = '';
}

function pinSubmit() {
  const stored = localStorage.getItem(PIN_KEY);
  if (pinStage === 'entry') {
    if (pinInput === stored) {
      document.getElementById('pinOverlay').classList.add('hidden');
    } else {
      pinError('Incorrect PIN');
    }
  } else if (pinStage === 'setup') {
    pinFirst = pinInput;
    pinInput = '';
    pinStage = 'confirm';
    updatePinUI('Confirm your PIN');
    updatePinDots();
  } else if (pinStage === 'confirm') {
    if (pinInput === pinFirst) {
      localStorage.setItem(PIN_KEY, pinInput);
      document.getElementById('pinOverlay').classList.add('hidden');
    } else {
      pinFirst = '';
      pinStage = 'setup';
      pinError('PINs didn\'t match — try again');
      updatePinUI('Choose a 4-digit PIN');
    }
  }
}

function pinError(msg) {
  pinInput = '';
  updatePinDots(true);
  document.getElementById('pinError').textContent = msg;
  setTimeout(() => { updatePinDots(false); }, 500);
}

function updatePinDots(error) {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`pd${i}`);
    el.classList.toggle('filled', !error && i < pinInput.length);

function loadState() {
  try {

    if (raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
    // Migrate from v2
    const old = localStorage.getItem('jhc2');
    if (old) {
      const p = JSON.parse(old);
      return Object.assign({}, DEFAULT_STATE, {
        tasks: (p.tasks || []).map(t => ({
          ...t,
          cat: t.cat === 'network' ? 'network' : t.cat // keep as-is, outside is new
        })),
        nextId: p.nextId || 1,
        totalAdded: p.totalAdded || 0,
        totalDone:  p.totalDone  || 0,
        doneBy: Object.assign({ apply:0, followup:0, network:0, research:0, outside:0, personal:0, todo:0 }, p.doneBy || {}),
        rejections: p.rejections || 0,
        xp: p.xp || 0,
        earned: p.earned || [],
      });

  } catch(e) {}
  return Object.assign({}, DEFAULT_STATE);

// ── DAY SNAPSHOT ─────────────────────────────────────────────
function saveDaySnapshot(sealed) {
  if (!S.todayDate || !S.todayEnergy) return;
  const focusTasks = S.todayFocusIds.map(id => S.tasks.find(t => t.id === id)).filter(Boolean);
  const snapshot = {
    date: S.todayDate,
    energy: S.todayEnergy,
    sealed: sealed || S.todaySealed || false,
    completedTasks: focusTasks.filter(t => t.done).map(t => ({ text: t.text, cat: t.cat })),
    incompleteTasks: focusTasks.filter(t => !t.done).map(t => ({ text: t.text, cat: t.cat })),
    wins: (S.wins || []).filter(w => new Date(w.date).toDateString() === S.todayDate).map(w => w.text),
    focusSessions: S.focusBlocksToday || 0,
    gotOutside: S.gotOutsideToday || false,
  };
  if (!S.dailySnapshots) S.dailySnapshots = [];
  const idx = S.dailySnapshots.findIndex(s => s.date === S.todayDate);
  if (idx >= 0) S.dailySnapshots[idx] = snapshot;
  else S.dailySnapshots.push(snapshot);
  if (S.dailySnapshots.length > 90) S.dailySnapshots = S.dailySnapshots.slice(-90);
}

// ── DAY RESET ────────────────────────────────────────────────
function checkDayReset() {
  const today = new Date().toDateString();
  if (S.todayDate !== today) {
    saveDaySnapshot(S.todaySealed || false); // capture yesterday before clearing
    S.todayDate         = today;
    S.todayEnergy       = null;
    S.todayFocusIds     = [...(S.carryOverIds || [])];
    S.focusBlocksToday  = 0;
    S.gotOutsideToday   = false;
    S.workedOutToday    = false;
    S.journaledToday    = false;
    S.todaySealed       = false;
    S.carryOverIds      = [];
    S.todayCalEvents    = [];
    save();
  }
}

// ── STREAK ───────────────────────────────────────────────────
function touchStreak(energy) {
  const today = new Date().toDateString();
  const alreadyToday = S.showUpDays.length > 0 &&
    S.showUpDays[S.showUpDays.length - 1].date === today;

  if (!alreadyToday) {
    // Find the previous required day, skipping weekends (Sat=6, Sun=0)
    let prevMs = Date.now() - 86400000;
    let prevDay = new Date(prevMs);
    while (prevDay.getDay() === 0 || prevDay.getDay() === 6) {
      prevMs -= 86400000;
      prevDay = new Date(prevMs);
    }
    const prevRequired = prevDay.toDateString();
    const hadPrev = S.showUpDays.some(d => d.date === prevRequired);
    S.showUpStreak = hadPrev ? S.showUpStreak + 1 : 1;
    S.maxShowUpStreak = Math.max(S.maxShowUpStreak, S.showUpStreak);
    S.showUpDays.push({ date: today, energy });
    if (S.showUpDays.length > 28) S.showUpDays.shift();
  } else {
    S.showUpDays[S.showUpDays.length - 1].energy = energy;
  }
}

// ── LEVEL ────────────────────────────────────────────────────
function getLvl(xp) {
  let i = 0;
  for (let j = LEVELS.length - 1; j >= 0; j--) { if (xp >= LEVELS[j].min) { i = j; break; } }
  const cur = LEVELS[i], next = LEVELS[i + 1] || null;
  const xpIn = xp - cur.min, xpFor = next ? next.min - cur.min : 9999;
  return { num: i+1, title: cur.title,
           pct: next ? Math.min(100, xpIn/xpFor*100) : 100,
           xpIn, xpFor, next };
}

function gainXP(amt) { S.xp += amt; }

// ── STREAK LABEL ─────────────────────────────────────────────
function timeOfDayWord() {
  const h = new Date().getHours();
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  return 'evening';
}

function streakLabel(n) {
  const word = timeOfDayWord();
  const plural = word + 's';
  if (n === 0) return `first ${word}`;
  if (n === 1) return `1 ${word}`;
  return `${n} ${plural}`;
}

      <div id="wins-list">${winsHtml}</div>

    ${overdueContacts.length > 0 ? `
    <div class="nudge-card">

      ${overdueContacts.map(c => {
        const days = getDaysSince(c.lastContact);

          <div class="contact-status-dot overdue" style="flex-shrink:0"></div>
          <div class="nudge-name">${escHtml(contactFullName(c))} <span style="font-size:0.7rem;color:var(--text-dim)">\u00b7 ${escHtml(c.company||'')}</span></div>

        : `<button onclick="openCloseOut()" style="background:none;border:none;color:var(--text-dim);font-size:0.74rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0;transition:color 0.15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">Close out the day \u2192</button>`

}

function makeFocusItemHTML(task) {
  let textHTML = escHtml(task.text);
  if (task.contactId) {
    const c = S.contacts.find(x => x.id === task.contactId);
    if (c) {
      const name = escHtml(contactFullName(c));
      textHTML = textHTML.replace(name, `<span onclick="event.stopPropagation();switchTab('network');setTimeout(()=>{networkOpenId=${task.contactId};renderNetwork();},50)" style="text-decoration:underline;cursor:pointer;">${name}</span>`);
    }
  }
  return `
    <div class="focus-item ${task.done ? 'focus-done' : ''}">
      <div class="check-circle ${task.done ? 'checked' : ''}" onclick="completeFocusTask(${task.id},event)" style="cursor:pointer">${task.done ? '✓' : ''}</div>
      <div class="focus-text">${textHTML}</div>
      ${catDot(task.cat, '18px')}
      <button class="del-btn" onclick="removeFocusItem(${task.id})">✕</button>
    </div>`;
}

function fmtWinDate(iso) {
  const d = new Date(iso);
  const t = new Date().toDateString(), y = new Date(Date.now()-86400000).toDateString();
  if (d.toDateString() === t) return 'Today';
  if (d.toDateString() === y) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// ── TODAY ACTIONS ────────────────────────────────────────────
function setEnergy(energy) {
  S.todayEnergy = energy;
  touchStreak(energy);
  const xp = ENERGY[energy].xp;
  gainXP(xp);
  if (energy === 'rest') S.totalRestDays = (S.totalRestDays || 0) + 1;
  save();
  render();
  checkAchievements();
}

function resetCheckin() {
  S.todayEnergy = null;
  save();
  renderToday();
}

function quickAddFocus() {
  const inp = document.getElementById('focus-quick-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  const task = { id: S.nextId++, text, cat: 'todo', done: false, createdAt: Date.now() };
  S.tasks.unshift(task);
  S.totalAdded++;
  S.todayFocusIds.push(task.id);
  save();
  inp.value = '';
  renderToday();
}

function removeFocusItem(id) {
  S.todayFocusIds = S.todayFocusIds.filter(fid => fid !== id);
  save();
  renderToday();
}

function completeFocusTask(id, event) {
  const task = S.tasks.find(t => t.id === id);
  if (!task || task.done) return;
  const cat = CATS[task.cat];
  const xp = cat ? cat.xp : 15;
  const oldLv = getLvl(S.xp).num;
  task.done = true;
  task.doneAt = Date.now();
  gainXP(xp);
  S.totalDone++;
  if (S.doneBy[task.cat] !== undefined) S.doneBy[task.cat]++;
  save();
  floatXP(event, `+${xp}`);
  renderToday();
  updateHeader();
  const newLv = getLvl(S.xp).num;
  if (newLv > oldLv) showLevelUp(newLv); else checkAchievements();
  if (task.fromReminders) {
    setTimeout(() => {
      const toast = document.getElementById('toast');
      if (toast) {
        toast.innerHTML = `Marked done · <span onclick="completeInReminders('${escHtml(task.text).replace(/'/g, "\\'")}')" style="text-decoration:underline;cursor:pointer">Also complete in Reminders →</span>`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 5000);
      }
    }, 800);
  }
}

function toggleOutside() {
  if (S.gotOutsideToday) return;
  S.gotOutsideToday = true;
  S.totalOutside = (S.totalOutside || 0) + 1;
  gainXP(20);
  save();
  updateHeader();
  renderToday();
  checkAchievements();
}

function logWin() {
  const inp = document.getElementById('win-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  S.wins.push({ text, date: new Date().toISOString() });
  S.totalWins = (S.totalWins || 0) + 1;
  gainXP(5);
  save();
  inp.value = '';
  updateHeader();
  renderToday();
  checkAchievements();
}

// ── CLOSE OUT THE DAY ────────────────────────────────────────
function openCloseOut() {
  const focusTasks  = S.todayFocusIds.map(id => S.tasks.find(t => t.id === id)).filter(Boolean);
  const done        = focusTasks.filter(t => t.done);
  const incomplete  = focusTasks.filter(t => !t.done);
  const todayWin    = [...S.wins].reverse().find(w => {
    const d = new Date(w.date);
    return d.toDateString() === new Date().toDateString();
  });
  const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const closeNote = randomPick(CLOSE_NOTES);

  const statsHtml = `
    <div style="display:flex;gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:18px 0;margin:16px 0 20px">
      <div style="flex:1;padding-right:16px;border-right:1px solid var(--border)">
        <div style="font-size:2rem;font-weight:200;font-family:'Montserrat',sans-serif;letter-spacing:-0.02em;line-height:1">${done.length}</div>
        <div style="font-size:0.58rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-top:5px;font-family:'Montserrat',sans-serif">completed</div>
      </div>
      <div style="flex:1;padding:0 16px;border-right:1px solid var(--border)">
        <div style="font-size:2rem;font-weight:200;font-family:'Montserrat',sans-serif;letter-spacing:-0.02em;line-height:1">${S.focusBlocksToday}</div>
        <div style="font-size:0.58rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-top:5px;font-family:'Montserrat',sans-serif">sessions</div>
      </div>
      <div style="flex:1;padding-left:16px">
        <div style="font-size:2rem;font-weight:200;font-family:'Montserrat',sans-serif;letter-spacing:-0.02em;line-height:1">${S.gotOutsideToday ? '✓' : '—'}</div>
        <div style="font-size:0.58rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-top:5px;font-family:'Montserrat',sans-serif">outside</div>
      </div>
    </div>`;

  const incompleteHtml = incomplete.length > 0 ? `
    <div style="margin-bottom:20px">
      <div class="card-label" style="margin-bottom:10px">Didn't get to</div>
      ${incomplete.map(t => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;font-size:0.82rem;color:var(--text-mid)">${escHtml(t.text)}</div>
          <button onclick="carryTask(${t.id})" style="background:none;border:none;font-size:0.65rem;color:var(--text-dim);cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;white-space:nowrap;padding:0;transition:color 0.15s" onmouseover="this.style.color='var(--amber)'" onmouseout="this.style.color='var(--text-dim)'">${(S.carryOverIds||[]).includes(t.id) ? '✓ Tomorrow' : '→ Tomorrow'}</button>
          <button onclick="releaseTask(${t.id})" style="background:none;border:none;font-size:0.65rem;color:var(--text-dim);cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;white-space:nowrap;padding:0;transition:color 0.15s" onmouseover="this.style.color='var(--text-mid)'" onmouseout="this.style.color='var(--text-dim)'">Let go</button>
        </div>`).join('')}
    </div>` : '';

  const winHtml = todayWin
    ? `<div style="margin-bottom:20px">
        <div class="card-label" style="margin-bottom:8px">Today's win</div>
        <div style="font-size:0.84rem;color:var(--text-mid);line-height:1.6">${escHtml(todayWin.text)}</div>
       </div>`
    : `<div style="margin-bottom:20px">
        <div class="card-label" style="margin-bottom:8px">One win before you go</div>
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:8px">Even something small. It happened.</div>
        <div class="add-form">
          <input class="add-input" id="closeout-win-input" placeholder="Something that went well today..." onkeydown="if(event.key==='Enter')closeOutWin()">
          <button class="add-btn" onclick="closeOutWin()">→</button>
        </div>
       </div>`;

  const inner = document.getElementById('modal-inner');
  inner.innerHTML = `
    <div style="text-align:left">
      <div style="font-size:1.4rem;font-weight:300;font-family:'Montserrat',sans-serif;letter-spacing:-0.02em;line-height:1.2;margin-bottom:4px">End of day</div>
      <div style="font-size:0.68rem;color:var(--text-dim);font-family:'Montserrat',sans-serif;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0">${dateStr}</div>
      ${statsHtml}
      ${incompleteHtml}
      ${winHtml}
      <div style="border-left:2px solid var(--border);padding:2px 0 2px 16px;margin-bottom:24px">
        <div style="font-size:0.78rem;color:var(--text-dim);line-height:1.7">${closeNote}</div>
      </div>
      <button onclick="sealDay()" style="width:100%;background:var(--text);color:var(--surface);border:none;padding:12px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.06em;text-transform:uppercase;border-radius:2px;transition:opacity 0.15s" onmouseover="this.style.opacity='0.75'" onmouseout="this.style.opacity='1'">Seal the day</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}

function carryTask(id) {
  if (!S.carryOverIds) S.carryOverIds = [];
  if (!S.carryOverIds.includes(id)) S.carryOverIds.push(id);
  save();
  openCloseOut(); // refresh modal
}

function releaseTask(id) {
  S.todayFocusIds = S.todayFocusIds.filter(fid => fid !== id);
  S.carryOverIds  = (S.carryOverIds || []).filter(fid => fid !== id);
  save();
  openCloseOut(); // refresh modal
}

function closeOutWin() {
  const inp = document.getElementById('closeout-win-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  S.wins.push({ text, date: new Date().toISOString() });
  S.totalWins = (S.totalWins || 0) + 1;
  gainXP(5);
  save();
  updateHeader();
  checkAchievements();
  openCloseOut(); // refresh to show the win
}

function sealDay() {
  saveDaySnapshot(true);
  S.todaySealed = true;
  save();
  closeModal();
  if (currentTab === 'today') renderToday();
}

function openFocusPicker() {
  const active = S.tasks.filter(t => !t.done && !S.todayFocusIds.includes(t.id));
  const inner = document.getElementById('modal-inner');
  if (active.length === 0) {
    inner.innerHTML = `
      <div class="modal-big-icon">📋</div>
      <div class="modal-title">Nothing left to pick</div>
      <div class="modal-body">All active tasks are already in today's focus, or you haven't added any yet. Head to the Tasks tab to add tasks.</div>
      <button class="modal-btn" onclick="closeModal()">Got it</button>`;
    document.getElementById('overlay').classList.add('show');
    return;
  }
  inner.innerHTML = `
    <div style="text-align:left">
      <div style="font-size:1rem;font-weight:600;color:var(--text);margin-bottom:3px">Pick a task</div>
      <div style="font-size:0.76rem;color:var(--text-dim);margin-bottom:12px">Select one to add to today's focus</div>
      <div style="max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:5px">
        ${active.map(t => {
          const cat = CATS[t.cat] || {};
          return `<div onclick="pinToFocus(${t.id})" style="padding:10px 11px;background:var(--surface2);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px">
            ${catDot(t.cat, '20px')}
            <div style="flex:1;font-size:0.81rem;color:var(--text)">${escHtml(t.text)}</div>
            <div style="font-size:0.63rem;color:var(--text-dim);white-space:nowrap">${cat.label||''}</div>
          </div>`;
        }).join('')}
      </div>
      <button onclick="closeModal()" style="margin-top:12px;width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text-mid);padding:9px;border-radius:8px;cursor:pointer;font-size:0.81rem">Cancel</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}

function pinToFocus(id) {
  if (!S.todayFocusIds.includes(id)) S.todayFocusIds.push(id);
  save();
  closeModal();
  if (currentTab === 'today') renderToday();
  if (currentTab === 'quests') renderQuests();
}

// ── FOCUS TIMER ──────────────────────────────────────────────
function renderFocusTimer() {
  const wrap = document.getElementById('focus-wrap');
  if (!wrap) return;

  const focusTasks = S.todayFocusIds.map(id => S.tasks.find(t => t.id === id)).filter(t => t && !t.done);
  const mins = String(Math.floor(timer.remaining / 60)).padStart(2, '0');
  const secs = String(timer.remaining % 60).padStart(2, '0');
  const sessionDots = Array.from({ length: Math.max(4, S.focusBlocksToday + 2) }, (_, i) =>
    `<div class="sdot ${i < S.focusBlocksToday ? 'done' : ''}"></div>`
  ).join('');
  const modeLabel = timer.mode === 'work' ? 'Focus' : timer.mode === 'short' ? 'Short Break' : 'Long Break';
  const noteText = timer.mode === 'work'
    ? 'One focused session at a time. You don\'t need to solve everything today.'
    : randomPick(BREAK_NOTES);

  wrap.innerHTML = `
    <div class="card" style="text-align:center;border-top:none;padding-top:0">
      <div class="timer-mode-row">
        <button class="timer-mode-btn ${timer.mode==='work'?'active':''}" onclick="setTimerMode('work')">Focus</button>
        <button class="timer-mode-btn ${timer.mode==='short'?'active':''}" onclick="setTimerMode('short')">Short Break</button>
        <button class="timer-mode-btn ${timer.mode==='long'?'active':''}" onclick="setTimerMode('long')">Long Break</button>
      </div>
      <div class="timer-display" id="timer-display">${mins}:${secs}</div>
      <div style="font-size:0.76rem;color:var(--text-dim);margin-bottom:20px">${modeLabel} · ${S.focusBlocksToday} session${S.focusBlocksToday!==1?'s':''} completed today</div>
      <div class="timer-controls">
        <button class="timer-btn primary" onclick="toggleTimer()" id="timer-start-btn">${timer.running ? 'Pause' : 'Start'}</button>
        <button class="timer-btn secondary" onclick="resetTimer()">Reset</button>
      </div>
      <div class="session-dots" style="margin-top:20px;justify-content:center">${sessionDots}</div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:0.78rem;font-weight:600;color:var(--text-mid);">Worked outside the timer?</div>
          <div style="font-size:0.72rem;color:var(--text-dim);">Log a session manually</div>
        </div>
        <button onclick="logFocusSessionManually()" style="background:none;border:1px solid var(--border);border-radius:2px;padding:7px 14px;font-size:0.82rem;font-weight:600;color:var(--text-mid);cursor:pointer;">+ Log</button>
      </div>
    </div>

    ${focusTasks.length > 0 ? `
    <div class="card">
      <div class="card-label">Working on</div>
      <select class="timer-task-select" id="timer-task-sel">
        ${focusTasks.map(t => `<option value="${t.id}">${escHtml(t.text)}</option>`).join('')}
      </select>
    </div>` : `
    <div class="card" style="text-align:center">
      <div style="font-size:0.8rem;color:var(--text-dim)">No focus items set for today. Add some in the Today tab.</div>
      <button onclick="switchTab('today')" style="margin-top:12px;background:none;border:none;color:var(--text-dim);font-size:0.72rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em">Go to Today →</button>
    </div>`}

    <div class="field-note">
      <div class="field-note-icon">${timer.mode==='work'?'💬':'☕'}</div>
      <div class="field-note-text">${noteText}</div>
    </div>

    <div class="card">
      <div class="card-label" style="margin-bottom:10px">Add to Google Calendar</div>
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
        <button class="gcal-btn" onclick="scheduleFocusBlock()">Add focus block</button>
        <span style="font-size:0.71rem;color:var(--text-dim)">Opens Google Calendar · use timer or + to log when done</span>
      </div>
    </div>
  `;
}

function toggleTimer() {
  if (timer.running) {
    clearInterval(timer.interval);
    timer.running = false;
  } else {
    timer.running = true;
    timer.interval = setInterval(timerTick, 1000);
  }
  const btn = document.getElementById('timer-start-btn');
  if (btn) btn.textContent = timer.running ? 'Pause' : 'Start';
}

function timerTick() {
  timer.remaining--;
  const mins = String(Math.floor(timer.remaining / 60)).padStart(2, '0');
  const secs = String(timer.remaining % 60).padStart(2, '0');
  const el = document.getElementById('timer-display');
  if (el) el.textContent = `${mins}:${secs}`;
  if (timer.remaining <= 0) {
    clearInterval(timer.interval);
    timer.running = false;
    timerDone();
  }
}

function timerDone() {
  if (timer.mode === 'work') {
    S.focusBlocksToday++;
    S.totalFocusBlocks = (S.totalFocusBlocks || 0) + 1;
    gainXP(15);
    save();
    updateHeader();
    renderFocusTimer();
    checkAchievements();
    showModal(`
      <div style="text-align:center;padding:8px 0;">
        <div style="font-size:2.5rem;font-weight:100;font-family:'Montserrat',sans-serif;color:var(--amber);letter-spacing:-0.02em;margin-bottom:4px;">${S.focusBlocksToday}</div>
        <div style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);font-family:'Montserrat',sans-serif;margin-bottom:16px;">session${S.focusBlocksToday!==1?'s':''} completed today</div>
        <div style="font-size:0.9rem;font-weight:600;color:var(--text);margin-bottom:6px;">Session complete</div>
        <div style="font-size:0.82rem;color:var(--text-mid);margin-bottom:20px;">Take a real break — it makes the next session better.</div>
        <div style="display:flex;gap:8px;">
          <button onclick="closeModal();setTimerMode('short')" style="flex:1;padding:10px;background:var(--surface2);border:none;border-radius:2px;font-size:0.85rem;font-weight:600;cursor:pointer;color:var(--text-mid);">Short break</button>
          <button onclick="closeModal();setTimerMode('work')" style="flex:1;padding:10px;background:var(--amber);color:#fff;border:none;border-radius:2px;font-size:0.85rem;font-weight:600;cursor:pointer;">Keep going</button>
        </div>
      </div>
    `);
  } else {
    showModal(`
      <div style="text-align:center;padding:8px 0;">
        <div style="font-size:0.9rem;font-weight:600;color:var(--text);margin-bottom:6px;">Break's over</div>
        <div style="font-size:0.82rem;color:var(--text-mid);margin-bottom:20px;">Ready when you are.</div>
        <button onclick="closeModal();setTimerMode('work')" style="width:100%;padding:10px;background:var(--amber);color:#fff;border:none;border-radius:2px;font-size:0.85rem;font-weight:600;cursor:pointer;">Start next session</button>
      </div>
    `);
  }
}

function setTimerMode(mode) {
  if (timer.running) { clearInterval(timer.interval); timer.running = false; }
  timer.mode = mode;
  timer.remaining = T_DUR[mode];
  renderFocusTimer();
}

function logFocusSessionManually() {
  S.focusBlocksToday++;
  S.totalFocusBlocks = (S.totalFocusBlocks || 0) + 1;
  save();
  updateHeader();
  renderFocusTimer();
  if (currentTab === 'today') renderToday();
  showToast(`Session logged · ${S.focusBlocksToday} today`);
  checkAchievements();
}

function resetTimer() {
  if (timer.running) { clearInterval(timer.interval); timer.running = false; }
  timer.remaining = T_DUR[timer.mode];
  renderFocusTimer();
}

// ── QUESTS TAB ───────────────────────────────────────────────
function renderQuests() {
  const wrap = document.getElementById('quests-wrap');
  if (!wrap) return;

  const active = S.tasks.filter(t => !t.done);
  const catTabsHTML = ['all', ...Object.keys(CATS)].map(c => {
    const count = c === 'all' ? active.length : active.filter(t => t.cat === c).length;
    const label = c === 'all' ? 'All' : CATS[c].label;
    return `<button class="cat-tab ${currentQuestCat===c?'active':''}" onclick="switchQuestCat('${c}')">${label} <span class="ct-badge">${count}</span></button>`;
  }).join('');

  const rejHtml = currentQuestCat === 'apply' ? `
    <div class="rejection-bar">
      <div>
        <div class="rejection-count">${S.rejections === 1 ? '1 rejection' : `${S.rejections} rejections`}</div>
        <div class="rejection-label">Every one means you put yourself out there. That counts.</div>
      </div>
      <button class="rejection-btn" onclick="logRejection()">+ Log rejection</button>
    </div>` : `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button onclick="logRejection()" style="background:none;border:none;color:var(--text-dim);font-size:0.68rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0;transition:color 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">${S.rejections > 0 ? `${S.rejections} rejection${S.rejections!==1?'s':''} logged →` : '+ Log rejection'}</button>
    </div>`;

  const activeTasks = currentQuestCat === 'all'
    ? S.tasks.filter(t => !t.done)
    : S.tasks.filter(t => !t.done && t.cat === currentQuestCat);
  const doneTasks = currentQuestCat === 'all'
    ? S.tasks.filter(t => t.done)
    : S.tasks.filter(t => t.done && t.cat === currentQuestCat);

  const catForNew = currentQuestCat === 'all' ? 'todo' : currentQuestCat;
  const ph = currentQuestCat === 'all' ? 'Add a task...' : (CATS[currentQuestCat]?.ph || 'Add a task...');

  const catSelectHTML = currentQuestCat === 'all' ? `
    <select class="add-select" id="quick-cat">
      ${Object.entries(CATS).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('')}
    </select>` : '';

  const emptyMsg = currentQuestCat === 'all'
    ? 'No tasks yet. Add something to work on.'
    : `No ${CATS[currentQuestCat]?.label || currentQuestCat} tasks yet.`;
  const tasksHTML = activeTasks.length === 0
    ? `<div class="empty"><div class="empty-icon">◦</div>${emptyMsg}</div>`
    : activeTasks.map(t => makeQuestTaskHTML(t, currentQuestCat === 'all')).join('');

  const doneHTML = doneTasks.length > 0 ? `
    <div style="margin-top:6px">
      <button class="done-toggle" id="done-tog" onclick="toggleDoneList()">▶ Show ${doneTasks.length} completed</button>
      <div id="done-list" style="display:none;margin-top:6px">
        ${doneTasks.map(t => makeQuestTaskHTML(t, currentQuestCat === 'all')).join('')}
      </div>
    </div>` : '';

  wrap.innerHTML = `
    <div id="questsContent">
    ${toggleHTML}
    <div class="cat-tabs">${catTabsHTML}</div>
    ${rejHtml}
    <div class="add-form">
      ${catSelectHTML}
      <input class="add-input" id="quest-input" placeholder="${ph}" onkeydown="if(event.key==='Enter')addQuestTask()">
      <button class="add-btn" onclick="addQuestTask()" title="Add to Show Up">+</button>
      <button class="add-btn" onclick="(function(){const v=document.getElementById('quest-input').value.trim();if(!v)return;addQuestTask();pushToReminders(v);})()" title="Add to Show Up + Reminders" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:0.62rem;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0 8px;white-space:nowrap">+R</button>
    </div>
    <div id="quest-list">${tasksHTML}</div>
    ${doneHTML}
    </div>
  `;
}

function makeQuestTaskHTML(task, showCat) {
  const cat = CATS[task.cat] || {};
  const isPinned = S.todayFocusIds.includes(task.id);
  return `
    <div class="task ${task.done?'done':''}">
      <div class="check-circle ${task.done?'checked':''}" onclick="completeQuestTask(${task.id},event)" style="cursor:pointer">${task.done?'✓':''}</div>
      <div class="task-text">${escHtml(task.text)}</div>
      <div class="task-meta">
        ${!task.done ? `<div class="xp-badge">+${cat.xp||15}</div>` : ''}
        ${showCat ? catDot(task.cat, '18px') : ''}
        ${!task.done && !isPinned ? `<button class="pin-btn" onclick="pinToFocus(${task.id})">→ Today</button>` : ''}
        ${!task.done && isPinned ? `<span class="pin-tag">Today ✓</span>` : ''}
      </div>
      <button class="del-btn" onclick="deleteQuestTask(${task.id})">✕</button>
    </div>`;
}

function switchQuestCat(cat) {
  currentQuestCat = cat;
  renderQuests();
}

function addQuestTask() {
  const inp = document.getElementById('quest-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  const cat = currentQuestCat === 'all'
    ? (document.getElementById('quick-cat')?.value || 'todo')
    : currentQuestCat;
  S.tasks.unshift({ id: S.nextId++, text, cat, done: false, createdAt: Date.now() });
  S.totalAdded++;
  save();
  inp.value = '';
  renderQuests();
}

function completeQuestTask(id, event) {
  const task = S.tasks.find(t => t.id === id);
  if (!task || task.done) return;
  const cat = CATS[task.cat];
  const xp = cat ? cat.xp : 15;
  const oldLv = getLvl(S.xp).num;
  task.done = true; task.doneAt = Date.now();
  gainXP(xp);
  S.totalDone++;
  if (S.doneBy[task.cat] !== undefined) S.doneBy[task.cat]++;
  save();
  floatXP(event, `+${xp}`);
  renderQuests();
  updateHeader();
  const newLv = getLvl(S.xp).num;
  if (newLv > oldLv) showLevelUp(newLv); else checkAchievements();
  if (task.fromReminders) {
    setTimeout(() => {
      const toast = document.getElementById('toast');
      if (toast) {
        toast.innerHTML = `Marked done · <span onclick="completeInReminders('${escHtml(task.text).replace(/'/g, "\\'")}')" style="text-decoration:underline;cursor:pointer">Also complete in Reminders →</span>`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 5000);
      }
    }, 800);
  }
}

function deleteQuestTask(id) {
  S.tasks = S.tasks.filter(t => t.id !== id);
  S.todayFocusIds = S.todayFocusIds.filter(fid => fid !== id);
  save();
  renderQuests();
}

function toggleDoneList() {
  const el = document.getElementById('done-list');
  const btn = document.getElementById('done-tog');
  if (!el || !btn) return;
  const showing = el.style.display !== 'none';
  const count = el.querySelectorAll('.task').length;
  el.style.display = showing ? 'none' : 'block';
  btn.textContent = showing
    ? `▶ Show ${count} completed`
    : `▼ Hide ${count} completed`;
}

// ── PIPELINE ─────────────────────────────────────────────────
function renderPipeline() {
  const container = document.getElementById('questsContent');
  if (!container) return;

  const active = S.pipeline.filter(e => !['rejected','withdrawn'].includes(e.stage));
  const closed = S.pipeline.filter(e => ['rejected','withdrawn'].includes(e.stage));


  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <span style="font-size:0.68rem;color:var(--text-dim);font-family:'Montserrat',sans-serif;letter-spacing:0.04em;text-transform:uppercase;">${active.length} active · ${closed.length} closed</span>
    <button onclick="openAddPipelineEntry()" style="background:none;border:none;color:var(--text-dim);font-size:0.74rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0;transition:color 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">+ Add</button>
  </div>`;

  if (S.pipeline.length === 0) {
    html += `<div class="empty">
      <div class="empty-icon">◦</div>
      <div>No applications yet.</div>
      <div style="margin-top:4px;font-size:0.78rem;">Track your interview pipeline here.</div>
      <button onclick="openAddPipelineEntry()" style="margin-top:14px;background:none;border:none;color:var(--text-dim);font-size:0.74rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0;transition:color 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">+ Add Application</button>
    </div>`;
    container.innerHTML = html;
    return;
  }

  const stageOrder = ['prospect','applied','phone','interview1','interview2','final','offer'];
  stageOrder.forEach(stageKey => {
    const entries = active.filter(e => e.stage === stageKey);
    if (entries.length === 0) return;
    const stageInfo = PIPELINE_STAGES.find(s => s.key === stageKey);
    html += `<div style="margin-bottom:12px;">
      <div style="font-size:0.68rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;font-family:'Montserrat',sans-serif;">${stageInfo.label} <span style="opacity:0.6">${entries.length}</span></div>
      ${entries.map(e => renderPipelineEntry(e)).join('')}
    </div>`;
  });

  if (closed.length > 0) {
    html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <div style="font-size:0.68rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;font-family:'Montserrat',sans-serif;">Closed <span style="opacity:0.6">${closed.length}</span></div>
      ${closed.map(e => renderPipelineEntry(e)).join('')}
    </div>`;
  }

  container.innerHTML = html;
}

function togglePipelineDetail(id) {
  pipelineOpenId = pipelineOpenId === id ? null : id;
  renderNetwork();
}

function updatePipelineStage(id, stage) {
  const e = S.pipeline.find(x => x.id === id);
  if (!e) return;
  e.stage = stage;
  save();
  renderNetwork();
}

function savePipelineField(id, field) {
  const e = S.pipeline.find(x => x.id === id);
  if (!e) return;
  let elId;
  if (field === 'appliedDate') elId = `pe-date-${id}`;
  else if (field === 'nextStep') elId = `pe-next-${id}`;
  else if (field === 'jdUrl') elId = `pe-url-${id}`;
  else elId = `pe-${field}-${id}`;
  const el = document.getElementById(elId);
  if (!el) return;
  e[field] = el.value;
  save();
}

        <button onclick="saveNewPipelineEntry()" style="flex:1;padding:9px;background:var(--text);color:var(--surface);border:none;border-radius:2px;font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.15s;" onmouseover="this.style.opacity='0.75'" onmouseout="this.style.opacity='1'">Add</button>

function saveNewPipelineEntry() {
  const company = (document.getElementById('np-company')||{}).value?.trim();
  if (!company) { showToast('Company name required'); return; }
  const role = (document.getElementById('np-role')||{}).value?.trim() || '';
  const stage = (document.getElementById('np-stage')||{}).value || 'applied';
  const appliedDate = (document.getElementById('np-date')||{}).value || '';
  const jdUrl = (document.getElementById('np-url')||{}).value?.trim() || '';
  S.pipeline.push({ id: S.nextPipelineId++, company, role, stage, appliedDate, jdUrl, nextStep: '', notes: '' });
  save();
  closeModal();
  networkView = 'pipeline';
  switchTab('network');
}

function deletePipelineEntry(id) {
  S.pipeline = S.pipeline.filter(x => x.id !== id);
  pipelineOpenId = null;
  save();
  renderNetwork();
}

// ── COMPANIES ─────────────────────────────────────────────────
function renderCompanies() {
  const container = document.getElementById('questsContent');

  const statuses = ['researching', 'targeting', 'applied'];

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">

  </div>`;

  if (S.companies.length === 0) {
    html += `<div style="text-align:center;padding:40px 20px;color:var(--text-dim);">
      <div style="font-size:1.8rem;font-weight:100;font-family:'Montserrat',sans-serif;margin-bottom:8px;">◎</div>
      <div style="font-weight:600;margin-bottom:4px;font-size:0.9rem;">No target companies yet</div>
      <div style="font-size:0.82rem;">Research and track companies you want to work for.</div>
      <button onclick="openAddCompany()" style="margin-top:16px;background:none;border:none;color:var(--amber);font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'Montserrat',sans-serif;">+ Add your first company</button>

      ${cos.map(c => renderCompanyRow(c)).join('')}
    </div>`;
  });

  container.innerHTML = html;
}

let companyOpenId = null;

function renderCompanyRow(c) {
  const isOpen = companyOpenId === c.id;
  const statusInfo = COMPANY_STATUSES.find(s => s.key === c.status) || COMPANY_STATUSES[0];
  const linkedContacts = S.contacts.filter(ct => ct.company && ct.company.toLowerCase() === c.name.toLowerCase());

function toggleCompanyDetail(id) {
  companyOpenId = companyOpenId === id ? null : id;
  renderCompanies();
}

function updateCompanyStatus(id, status) {
  const c = S.companies.find(x => x.id === id);
  if (c) { c.status = status; save(); renderCompanies(); }
}

function saveCompanyField(id, field) {
  const c = S.companies.find(x => x.id === id);
  if (!c) return;
  const el = document.getElementById(`co-${field}-${id}`);
  if (el) { c[field] = el.value.trim(); save(); }
}

function deleteCompany(id) {
  S.companies = S.companies.filter(x => x.id !== id);
  companyOpenId = null;
  save();
  renderCompanies();
}

// ── WEEKLY PLANNING ──────────────────────────────────────────
function getWeekStart(date) {
  const d = date ? new Date(date) : new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.toISOString().slice(0,10);
}

function getCurrentWeekPlan() {
  const ws = getWeekStart();
  return S.weeklyPlans.find(p => p.weekStart === ws) || null;
}

function isMonday() { return new Date().getDay() === 1; }
function isFriday() { return new Date().getDay() === 5; }

function shouldShowWeekPlanner() {
  const ws = getWeekStart();
  const plan = getCurrentWeekPlan();
  if (plan && plan.goals && plan.goals.filter(Boolean).length > 0) return false;
  if (S.weekPromptDismissed === ws) return false;
  return isMonday();
}

function shouldShowWeekReview() {
  const ws = getWeekStart();
  const plan = getCurrentWeekPlan();
  if (plan && plan.reviewDone) return false;
  if (S.weekPromptDismissed === ws + '-review') return false;
  return isFriday();
}

function getWeekStats() {
  const ws = getWeekStart();
  const wEnd = new Date(ws);
  wEnd.setDate(wEnd.getDate() + 6);
  const wEndStr = wEnd.toISOString().slice(0,10);
  const tasks = S.tasks.filter(t => t.done && t.doneDate >= ws && t.doneDate <= wEndStr);
  return {
    tasksCompleted: tasks.length,
    applyCount: tasks.filter(t => t.cat === 'apply').length,
    networkCount: tasks.filter(t => t.cat === 'network').length,
    focusBlocks: S.focusBlocksToday,
  };
}

function saveWeeklyPlan() {
  const ws = getWeekStart();
  let plan = getCurrentWeekPlan();
  const g1 = (document.getElementById('wg-1')||{}).value?.trim() || '';
  const g2 = (document.getElementById('wg-2')||{}).value?.trim() || '';
  const g3 = (document.getElementById('wg-3')||{}).value?.trim() || '';
  const intention = (document.getElementById('w-intention')||{}).value?.trim() || '';
  if (!plan) {

function fmtGCal(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}

// Opens Google Calendar with a pre-filled event — no login required, user just confirms
function openGCal(title, startDate, durationMins, description) {
  const end = new Date(startDate.getTime() + durationMins * 60000);
  const url = `https://calendar.google.com/calendar/event?action=TEMPLATE`
    + `&text=${encodeURIComponent(title)}`
    + `&dates=${fmtGCal(startDate)}/${fmtGCal(end)}`
    + `&details=${encodeURIComponent(description || '')}`;
  window.open(url, '_blank');
}
