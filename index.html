function logWorkout() {
  const today = new Date().toISOString().slice(0,10);
  if (S.workedOutToday) {
    S.workedOutToday = false;
    S.workoutLog = (S.workoutLog || []).filter(d => d !== today);
  } else {
    S.workedOutToday = true;
    if (!S.workoutLog) S.workoutLog = [];
    if (!S.workoutLog.includes(today)) S.workoutLog.push(today);
  }
  save();
  renderToday();
  if (S.workedOutToday) showToast('Workout logged ✓');
}

function getWorkoutsThisMonth() {
  const now = new Date();
  const prefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return (S.workoutLog || []).filter(d => d.startsWith(prefix)).length;
}

function getJournalsThisWeek() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon...6=Sat
  const daysFromMon = day === 0 ? 6 : day - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - daysFromMon);
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return (S.journalLog || []).filter(d => {
    const dt = new Date(d).getTime();
    return dt >= monday.getTime() && dt <= sunday.getTime();
  }).length;
}

function toggleJournal() {
  const today = new Date().toISOString().slice(0, 10);
  if (S.journaledToday) {
    S.journaledToday = false;
    S.journalLog = (S.journalLog || []).filter(d => d !== today);
  } else {
    S.journaledToday = true;
    if (!S.journalLog) S.journalLog = [];
    if (!S.journalLog.includes(today)) S.journalLog.push(today);
  }
  save();
  renderToday();
}

function checkWorkoutImport() {

  if (params.get('workout') === 'logged') {

// ── NETWORK ──────────────────────────────────────────────────
function getDefaultCadence(type) {
  return { mentor: 30, peer: 14, mentee: 30, recruiter: 30 }[type] || 30;
}

function getDaysSince(dateStr) {
  if (!dateStr) return null;
  const ms = Date.now() - new Date(dateStr).getTime();
  return Math.floor(ms / 86400000);
}

function getContactStatus(contact) {
  if (!contact.lastContact) return 'unset';
  if (!contact.cadence) return 'unset'; // only show overdue if user explicitly set a cadence
  const days = getDaysSince(contact.lastContact);
  if (days === null) return 'unset';
  if (days >= contact.cadence) return 'overdue';
  if (days >= contact.cadence - 7) return 'due-soon';
  return 'ok';
}

function contactFullName(c) { return `${c.first} ${c.last}`.trim(); }

function parseSheetDate(str) {
  if (!str || !str.trim()) return null;
  const parts = str.trim().split('/');
  if (parts.length !== 3) return null;
  const [m, d, y] = parts.map(Number);
  const year = y < 100 ? 2000 + y : y;
  return `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function mapContactType(str) {
  const t = (str || '').toLowerCase().trim();
  if (t === 'mentor') return 'mentor';
  if (t === 'mentee') return 'mentee';
  if (t === 'recruiter') return 'recruiter';
  return 'peer';
}

function parseCSVText(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let inQuote = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === ',' && !inQuote) { row.push(cell.trim().replace(/^"|"$/g, '')); cell = ''; }
      else { cell += ch; }
    }
    row.push(cell.trim().replace(/^"|"$/g, ''));
    rows.push(row);
  }
  return rows;
}

function importContactsCSV() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,text/csv,application/csv,text/plain';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const rows = parseCSVText(ev.target.result);
        if (rows.length < 2) { alert('CSV appears empty.'); return; }
        const hdrs = rows[0].map(h => h.toLowerCase().trim());
        const hasTypeCol = hdrs.some(h => h === 'type');
        _pendingImportRows = { rows, hdrs };
        if (hasTypeCol) {
          runContactImport('peer');
        } else {
          const inner = document.getElementById('modal-inner');
          inner.innerHTML = `
            <div style="text-align:left">
              <div style="font-size:1rem;font-weight:600;color:var(--text);margin-bottom:6px">What type are these contacts?</div>
              <div style="font-size:0.76rem;color:var(--text-dim);margin-bottom:14px">This CSV has no Type column. All contacts will be set to the type you choose.</div>
              <select class="contact-inline-input" id="import-type-sel" style="margin-bottom:14px">
                <option value="recruiter">Recruiter</option>
                <option value="peer">Peer</option>
                <option value="mentor">Mentor</option>
                <option value="mentee">Mentee</option>
              </select>
              <div style="display:flex;gap:8px">
                <button class="net-add-btn primary" style="flex:1" onclick="const t=document.getElementById('import-type-sel').value;closeModal();runContactImport(t)">Import</button>
                <button class="net-add-btn" onclick="closeModal()">Cancel</button>
              </div>
            </div>`;
          document.getElementById('overlay').classList.add('show');
        }
      } catch(err) {
        alert('Could not parse this CSV. Please export directly from Google Sheets.');
        console.error(err);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function runContactImport(defaultType) {
  if (!_pendingImportRows) return;
  const { rows, hdrs } = _pendingImportRows;
  _pendingImportRows = null;
  const col = key => hdrs.findIndex(h => h.includes(key));
  const typeI  = col('type'),
        firstI = col('first'), lastI = col('last'),
        nameI  = hdrs.findIndex(h => h === 'contact name' || h === 'name' || h === 'full name'),
        compI  = hdrs.findIndex(h => h.includes('company') || h === 'firm' || h === 'organization'),
        roleI  = hdrs.findIndex(h => h === 'title' || h === 'role' || h.includes('job title')),
        emailI = col('email'),
        lcI    = hdrs.findIndex(h => h.includes('last contact') || h.includes('last cont')),
        methI  = col('method'), resI = col('resume'),
        notesI = hdrs.findIndex(h => h === 'notes' || h === 'note'),
        specI  = hdrs.findIndex(h => h === 'specialty' || h === 'speciality' || h === 'specialties'),
        nextI  = hdrs.findIndex(h => h.includes('next step'));
  let count = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    let first = firstI >= 0 ? (r[firstI]||'').trim() : '';
    let last  = lastI  >= 0 ? (r[lastI] ||'').trim() : '';
    // Handle combined "Contact Name" or "Name" column
    if (!first && !last && nameI >= 0 && (r[nameI]||'').trim()) {
      const parts = (r[nameI]||'').trim().split(/\s+/);
      first = parts[0] || '';
      last  = parts.slice(1).join(' ') || '';
    }
    if (!first && !last) continue;
    // Merge notes + specialty
    const notesVal    = notesI >= 0 ? (r[notesI]||'').trim() : '';
    const specVal     = specI  >= 0 ? (r[specI] ||'').trim() : '';
    const combinedNotes = [notesVal, specVal ? `Specialty: ${specVal}` : ''].filter(Boolean).join(' · ');
    const rawType = typeI >= 0 ? (r[typeI]||'') : '';
    S.contacts.push({
      id: S.nextContactId++,
      type: rawType ? mapContactType(rawType) : defaultType,
      first, last,
      name: [first, last].filter(Boolean).join(' '),
      company: compI  >= 0 ? ((r[compI]||'').trim() === '?' ? '' : (r[compI]||'').trim()) : '',
      role:    roleI  >= 0 ? (r[roleI] ||'').trim() : '',
      email:   emailI >= 0 ? (r[emailI]||'').trim() : '',
      lastContact: lcI >= 0 ? parseSheetDate(r[lcI]||'') : null,
      preferredMethod: methI >= 0 ? (r[methI]||'').trim() : '',
      resumeSent: resI >= 0 && !!(r[resI] && r[resI].trim()),
      nextStep: nextI >= 0 ? (r[nextI]||'').trim() : '',
      cadence: null,
      notes: combinedNotes,
      interactions: [],
      priority: false,
      nextContactDate: '',
      followUpNote: '',
    });
    count++;
  }
  save();
  renderNetwork();
  showToast(`${count} contacts imported \u2713`);
}

function getFollowUpNudges() {

function renderNetwork() {
  const wrap = document.getElementById('network-wrap');
  if (!wrap) return;

  const toggleHTML = `<div style="display:flex;gap:20px;border-bottom:1px solid var(--border);padding-bottom:0;margin-bottom:20px;">
    <button class="view-toggle-btn ${networkView==='people'?'active':''}" onclick="networkView='people';renderNetwork()">People</button>
    <button class="view-toggle-btn ${networkView==='pipeline'?'active':''}" onclick="networkView='pipeline';renderNetwork()">Pipeline</button>
    <button class="view-toggle-btn ${networkView==='companies'?'active':''}" onclick="networkView='companies';renderNetwork()">Companies</button>
  </div>`;

  if (networkView === 'pipeline') {
    wrap.innerHTML = `<div id="questsContent">${toggleHTML}</div>`;
    renderPipeline();
    return;
  }

  if (networkView === 'companies') {
    wrap.innerHTML = `<div id="questsContent">${toggleHTML}</div>`;
    renderCompanies();
    return;
  }

  const contacts = S.contacts || [];

  // Type filter
  let filtered = contacts;
  if (networkFilter === 'not-recently') filtered = contacts.filter(c => c.lastContact);
  else if (networkFilter === 'priority') filtered = contacts.filter(c => c.priority);
  else if (['mentor','peer','mentee','recruiter'].includes(networkFilter))
    filtered = contacts.filter(c => c.type === networkFilter);

  // Status filter
  if (networkStatusFilter === 'overdue') filtered = filtered.filter(c => getContactStatus(c) === 'overdue');
  else if (networkStatusFilter === 'due-soon') filtered = filtered.filter(c => getContactStatus(c) === 'due-soon');
  else if (networkStatusFilter === 'no-date') filtered = filtered.filter(c => !c.lastContact);

  // Search
  const q = (networkSearch || '').toLowerCase();
  if (q) filtered = filtered.filter(c =>
    contactFullName(c).toLowerCase().includes(q) ||
    (c.company || '').toLowerCase().includes(q) ||
    (c.notes || '').toLowerCase().includes(q)
  );

  // Sort
  if (networkSort === 'alpha') {
    filtered = [...filtered].sort((a, b) => contactFullName(a).localeCompare(contactFullName(b)));
  } else if (networkSort === 'oldest') {
    // oldest contact first (longest since contact), no-date contacts at top
    filtered = [...filtered].sort((a, b) => {
      if (!a.lastContact && !b.lastContact) return contactFullName(a).localeCompare(contactFullName(b));
      if (!a.lastContact) return -1;
      if (!b.lastContact) return 1;
      return new Date(a.lastContact) - new Date(b.lastContact);
    });
  } else {
    // 'recent' default: overdue first, then due-soon, then ok, then unset — within each, most recent first or alphabetical
    const order = { overdue: 0, 'due-soon': 1, ok: 2, unset: 3 };
    filtered = [...filtered].sort((a, b) => {
      const sa = order[getContactStatus(a)], sb = order[getContactStatus(b)];
      if (sa !== sb) return sa - sb;
      if (sa === 0) {
        const da = getDaysSince(a.lastContact) || 0;
        const db = getDaysSince(b.lastContact) || 0;
        return db - da;
      }
      if (a.lastContact && b.lastContact) return new Date(b.lastContact) - new Date(a.lastContact);
      return contactFullName(a).localeCompare(contactFullName(b));
    });
  }

  const filterBtns = [
    { key: 'all',       label: 'All' },
    { key: 'not-recently', label: 'Not recently' },
    { key: 'priority',  label: '\u2605' },
    { key: 'mentor',    label: 'Mentors' },
    { key: 'peer',      label: 'Peers' },
    { key: 'mentee',    label: 'Mentees' },
    { key: 'recruiter', label: 'Recruiters' },
  ].map(f => `<button class="net-filter ${networkFilter===f.key?'active':''}" onclick="setNetworkFilter('${f.key}')">${f.label}</button>`).join('');

  const statusBtns = [
    { key: 'all',      label: 'All' },
    { key: 'overdue',  label: 'Overdue' },
    { key: 'due-soon', label: 'Due soon' },
    { key: 'no-date',  label: 'No date yet' },
  ].map(f => `<button class="net-filter ${networkStatusFilter===f.key?'active':''}" onclick="networkStatusFilter='${f.key}';renderNetwork()">${f.label}</button>`).join('');

  const sortSelect = `<select onchange="networkSort=this.value;renderNetwork()" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:0.72rem;font-family:'DM Sans',sans-serif;padding:3px 0;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;">
    <option value="recent" ${networkSort==='recent'?'selected':''}>Recent first</option>
    <option value="oldest" ${networkSort==='oldest'?'selected':''}>Oldest contact first</option>
    <option value="alpha" ${networkSort==='alpha'?'selected':''}>Name A–Z</option>
  </select>`;

  // Split into active (have lastContact) and aspirational (no lastContact)
  // Only split when showing 'all' filter with no status filter override
  let activeContacts = filtered;
  let aspirationalContacts = [];

  if ((networkFilter === 'all' || networkFilter === 'not-recently') && networkStatusFilter === 'all') {
    activeContacts = filtered.filter(c => c.lastContact);
    aspirationalContacts = filtered.filter(c => !c.lastContact);
  }

  const activeHTML = activeContacts.length > 0
    ? activeContacts.map(c => renderContactCard(c)).join('')
    : `<div style="font-size:0.78rem;color:var(--text-dim);padding:12px 0">No contacts here yet.</div>`;

  const aspCount = aspirationalContacts.length;
  const aspirationalHTML = aspCount > 0 ? `
    <div style="margin-top:20px">
      <button onclick="toggleAspirationalsVisible()" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="font-size:0.58rem;font-family:'Montserrat',sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-dim)" id="asp-toggle-label">${S.aspirationalsVisible ? '▾' : '▸'} ${aspCount} aspirational</span>
      </button>
      <div id="aspirationals-list" style="display:${S.aspirationalsVisible ? 'block' : 'none'}">
        ${aspirationalContacts.map(c => renderContactCard(c)).join('')}
      </div>
    </div>` : '';

  const listHTML = (activeContacts.length === 0 && aspirationalContacts.length === 0)
    ? `<div class="network-empty">${contacts.length === 0
        ? 'No contacts yet.<br>Import from Google Sheets or add one manually.'
        : 'No contacts match this filter.'
      }</div>`
    : activeHTML + aspirationalHTML;

  wrap.innerHTML = `
    ${toggleHTML}
    <div class="net-add-row">
      <button class="net-add-btn primary" onclick="openAddContactForm()">+ Add contact</button>
      <button class="net-add-btn" onclick="importContactsCSV()">Import from CSV</button>
      <span style="font-size:0.68rem;color:var(--text-dim);align-self:center;margin-left:2px">${contacts.length} contacts</span>
    </div>
    <div class="network-toolbar">
      <div style="position:relative;flex:1;min-width:140px;">
        <input class="network-search" id="net-search-input" placeholder="Search contacts..." value="${escHtml(networkSearch)}"
          oninput="networkSearch=this.value;renderNetwork()" style="width:100%;padding-right:${networkSearch?'24px':'2px'};">
        ${networkSearch ? `<button onclick="networkSearch='';renderNetwork()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.9rem;padding:2px 4px;line-height:1;">×</button>` : ''}
      </div>
    </div>
    <div class="net-filter-row">${filterBtns}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:12px;">
      <div class="net-filter-row" style="margin-bottom:0;">${statusBtns}</div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span style="font-size:0.68rem;color:var(--text-dim);font-family:'Montserrat',sans-serif;letter-spacing:0.03em;">Sort:</span>
        ${sortSelect}
      </div>
    </div>
    <div class="contact-list">${listHTML}</div>
  `;
}

function renderContactCard(c) {
  const status = getContactStatus(c);
  const days = getDaysSince(c.lastContact);
  const cadence = c.cadence || getDefaultCadence(c.type);
  const isOpen = networkOpenId === c.id;

  let lastStr = '\u2014';
  if (c.lastContact) {
    if (days === 0) lastStr = 'Today';
    else if (days === 1) lastStr = 'Yesterday';
    else lastStr = `${days}d ago`;
  }

  const today = new Date().toISOString().split('T')[0];
  const hasRealHistory = c.interactions && c.interactions.length > 0;
  const hasSyntheticEntry = !hasRealHistory && c.lastContact && c.preferredMethod;

  const historyHTML = hasRealHistory
    ? c.interactions.slice(0, 8).map(ix => `
        <div class="contact-interaction-entry">
          <span class="contact-interaction-date">${new Date(ix.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}${ix.method ? ' · ' + escHtml(ix.method) : ''}</span>
          ${ix.notes ? `<br>${escHtml(ix.notes)}` : ''}
        </div>`).join('')
    : hasSyntheticEntry
      ? `<div class="contact-interaction-entry">
          <span class="contact-interaction-date">${new Date(c.lastContact).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} · ${escHtml(c.preferredMethod)}</span>
          <br><span style="opacity:0.55;font-style:italic">from your records</span>
        </div>`
      : `<div style="font-size:0.74rem;color:var(--text-dim);padding:4px 0">No interactions logged yet.</div>`;

  const detailHTML = isOpen ? `
    <div class="contact-detail">

      <div>
        <div class="card-label">Interaction history</div>
        ${historyHTML}
      </div>

      <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
        <div class="card-label">Log interaction</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px">
          <input type="date" class="contact-inline-input" id="qi-date-${c.id}"
            value="${today}" style="flex:1;min-width:120px;max-width:160px">
          <select class="contact-inline-input" id="qi-method-${c.id}" style="flex:1;min-width:130px">
            ${['Email','LinkedIn','In person','Zoom','Phone','Text','Other'].map(m =>
              `<option value="${m}" ${c.preferredMethod===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <textarea class="contact-inline-input" id="qi-notes-${c.id}" rows="2"
          placeholder="What happened? Any context or next steps..." style="margin-bottom:7px"></textarea>
        <button class="contact-action-btn" onclick="event.stopPropagation();quickLogInteraction(${c.id})">Log it</button>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
        <div class="card-label">Details</div>

        <div>
          <div class="contact-detail-section-label">Last contact date</div>
          <input type="date" class="contact-inline-input" id="lc-${c.id}"
            value="${c.lastContact || ''}" style="max-width:160px"
            onchange="saveContactLastContact(${c.id})">
        </div>

        ${c.email ? `<div style="margin-top:10px;">
          <div class="contact-detail-section-label">Email</div>
          <div style="font-size:0.8rem;color:var(--text-mid)">${escHtml(c.email)}</div>
        </div>` : ''}

        ${c.linkedin ? `<div style="margin-top:10px;">
          <div class="contact-detail-section-label">LinkedIn</div>
          <a href="${escHtml(c.linkedin.startsWith('http') ? c.linkedin : 'https://' + c.linkedin)}" target="_blank" rel="noopener" style="font-size:0.8rem;color:var(--amber);text-decoration:none;word-break:break-all;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${escHtml(c.linkedin)}</a>
        </div>` : ''}

        <div style="margin-top:10px;">
          <div class="contact-detail-section-label">Next step</div>
          <textarea class="contact-inline-input" id="ns-${c.id}" rows="2"
            placeholder="What's the next thing to do with this person?"

        </div>

        <div style="margin-top:10px;">
          <div class="contact-detail-section-label">Notes</div>
          <textarea class="contact-inline-input" id="note-${c.id}" rows="3"
            placeholder="Context, background, things to remember..."
            onblur="saveContactNotes(${c.id})">${escHtml(c.notes || '')}</textarea>
        </div>

        <div style="margin-top:10px;">
          <div class="contact-detail-section-label">Planned follow-up</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
            <input type="date" id="fu-date-${c.id}" value="${escHtml(c.nextContactDate||'')}" class="contact-inline-input" style="flex:1;padding:7px 10px;">

}

// ── JOURNAL ──────────────────────────────────────────────────
function renderJournal() {
  const wrap = document.getElementById('journal-wrap');
  if (!wrap) return;

  const year = journalViewYear, month = journalViewMonth;
  const monthLabel = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const today = new Date().toDateString();

  // Calendar grid
  const firstDow  = new Date(year, month, 1).getDay(); // 0=Sun
  const startOff  = (firstDow + 6) % 7;               // shift to Mon=0
  const daysInMo  = new Date(year, month + 1, 0).getDate();
  const dayNames  = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  let cells = dayNames.map(d => `<div class="journal-day-label">${d}</div>`).join('');
  for (let i = 0; i < startOff; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMo; d++) {
    const date = new Date(year, month, d).toDateString();
    const snap = (S.dailySnapshots || []).find(s => s.date === date);
    const cls  = ['journal-day',
      snap ? 'has-data' : '',
      snap ? snap.energy : '',
      date === today ? 'is-today' : '',
      date === journalSelectedDate ? 'selected' : '',
      snap?.sealed ? 'sealed' : '',
    ].filter(Boolean).join(' ');
    const click = snap ? `onclick="selectJournalDay('${date}')"` : '';
    cells += `<div class="${cls}" ${click}>${d}</div>`;
  }

  const snaps = S.dailySnapshots || [];
  const selectedSnap = journalSelectedDate ? snaps.find(s => s.date === journalSelectedDate) : null;
  const noData = snaps.length === 0;

  wrap.innerHTML = `
    <div class="journal-cal">
      <div class="journal-cal-header">
        <button class="journal-cal-nav" onclick="journalPrevMonth()">←</button>
        <div class="journal-cal-title">${monthLabel}</div>
        <button class="journal-cal-nav" onclick="journalNextMonth()">→</button>
      </div>
      <div class="journal-month-grid">${cells}</div>
    </div>
    ${selectedSnap
      ? `<div style="margin-top:16px;">
          <button onclick="journalSelectedDate=null;renderJournal()" style="background:none;border:none;color:var(--text-dim);font-size:0.78rem;cursor:pointer;font-family:'Montserrat',sans-serif;letter-spacing:0.04em;padding:0;display:flex;align-items:center;gap:4px;margin-bottom:16px;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2L4 6l4 4"/></svg>
            Back to calendar
          </button>
          ${renderJournalDay(selectedSnap)}
        </div>`
      : noData
        ? `<div style="padding-top:4px;font-size:0.8rem;color:var(--text-dim);line-height:1.7">No days recorded yet.<br>Seal your first day and it'll appear here.</div>`
        : `<div style="padding-top:4px;font-size:0.76rem;color:var(--text-dim)">Select a day above to see what happened.</div>`
    }
  `;
}

function renderJournalDay(snap) {
  const d = new Date(snap.date);
  const dateLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const ec = ENERGY[snap.energy] || {};

  const completedHtml = snap.completedTasks && snap.completedTasks.length > 0
    ? snap.completedTasks.map(t => `
        <div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)">
          ${catDot(t.cat, '16px')}
          <div style="font-size:0.82rem;color:var(--text-mid);opacity:0.7;text-decoration:line-through">${escHtml(t.text)}</div>
        </div>`).join('')
    : `<div style="font-size:0.76rem;color:var(--text-dim);padding:8px 0">Nothing completed.</div>`;

  const incompleteHtml = snap.incompleteTasks && snap.incompleteTasks.length > 0 ? `
    <div style="margin-top:20px">
      <div class="card-label" style="margin-bottom:8px">Didn't get to</div>
      ${snap.incompleteTasks.map(t => `
        <div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)">
          ${catDot(t.cat, '16px')}
          <div style="font-size:0.82rem;color:var(--text-dim)">${escHtml(t.text)}</div>
        </div>`).join('')}
    </div>` : '';

  const winsHtml = snap.wins && snap.wins.length > 0
    ? snap.wins.map(w => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--text-mid)">${escHtml(w)}</div>`).join('')
    : `<div style="font-size:0.76rem;color:var(--text-dim);padding:8px 0">No wins logged.</div>`;

  return `
    <div style="border-top:1px solid var(--border);padding-top:20px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2px">
        <div class="journal-detail-date">${dateLabel}</div>
        <span style="font-size:0.56rem;font-family:'Montserrat',sans-serif;letter-spacing:0.09em;text-transform:uppercase;color:${snap.sealed ? 'var(--amber)' : 'var(--text-dim)'};margin-top:4px">${snap.sealed ? 'Sealed' : 'Partial'}</span>
      </div>
      <div style="font-size:0.68rem;color:var(--text-dim);font-family:'Montserrat',sans-serif;letter-spacing:0.04em;margin-bottom:0">${ec.label || snap.energy}</div>

      <div class="journal-stats-row">
        <div class="journal-stat">
          <div class="journal-stat-val">${(snap.completedTasks || []).length}</div>
          <div class="journal-stat-lbl">completed</div>
        </div>
        <div class="journal-stat">
          <div class="journal-stat-val">${snap.focusSessions || 0}</div>
          <div class="journal-stat-lbl">sessions</div>
        </div>
        <div class="journal-stat">
          <div class="journal-stat-val">${snap.gotOutside ? '✓' : '—'}</div>
          <div class="journal-stat-lbl">outside</div>
        </div>
      </div>

      <div class="card-label" style="margin-bottom:8px">Completed</div>
      ${completedHtml}
      ${incompleteHtml}

      <div class="card-label" style="margin-top:20px;margin-bottom:8px">Wins</div>
      ${winsHtml}
    </div>`;
}

function journalPrevMonth() {
  journalViewMonth--;
  if (journalViewMonth < 0) { journalViewMonth = 11; journalViewYear--; }
  renderJournal();
}

function journalNextMonth() {
  journalViewMonth++;
  if (journalViewMonth > 11) { journalViewMonth = 0; journalViewYear++; }
  renderJournal();
}

function selectJournalDay(date) {
  journalSelectedDate = journalSelectedDate === date ? null : date;
  renderJournal();
}

// ── DATA EXPORT / IMPORT ─────────────────────────────────────
function exportData() {
  const json = JSON.stringify(S, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `showup-data-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported ✓');
}

let _pendingImportData = null;

function doImport(data) {
  S = Object.assign({}, DEFAULT_STATE, data);
  save();
  render();
  showToast('Data imported ✓');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.tasks && !parsed.xp && !parsed.wins) throw new Error('Unrecognised file');
        _pendingImportData = parsed;
        showModal(`
          <div style="text-align:left">
            <div style="font-size:1.1rem;font-weight:600;color:var(--text);margin-bottom:8px;">Import data?</div>
            <div style="font-size:0.82rem;color:var(--text-mid);margin-bottom:20px;">This will replace all your current data. This cannot be undone.</div>
            <div style="display:flex;gap:8px;">
              <button onclick="closeModal()" style="flex:1;padding:9px;border:none;background:var(--surface2);border-radius:2px;font-size:0.85rem;cursor:pointer;color:var(--text-mid);">Cancel</button>
              <button onclick="closeModal();doImport(_pendingImportData)" style="flex:1;padding:9px;background:var(--red);color:#fff;border:none;border-radius:2px;font-size:0.85rem;font-weight:600;cursor:pointer;">Replace data</button>
            </div>
          </div>
        `);
      } catch(err) {
        alert('Could not read that file. Make sure it\'s a Show Up export.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── REMINDERS BRIDGE ─────────────────────────────────────────
function checkURLImport() {
  try {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('import');
    if (!raw) return;
    const tasks = decodeURIComponent(raw).split('|').map(t => t.trim()).filter(Boolean);
    if (!tasks.length) return;
    pendingReminderImport = tasks;
    window.history.replaceState({}, '', window.location.pathname);
    setTimeout(showReminderImportModal, 400);
  } catch(e) {}
}

function showReminderImportModal() {
  if (!pendingReminderImport || !pendingReminderImport.length) return;
  const inner = document.getElementById('modal-inner');
  const count = pendingReminderImport.length;
  const preview = pendingReminderImport.slice(0, 6)
    .map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-mid)">${escHtml(t)}</div>`)
    .join('');
  const more = count > 6 ? `<div style="font-size:0.72rem;color:var(--text-dim);padding:6px 0">+${count - 6} more</div>` : '';
  inner.innerHTML = `
    <div class="modal-big-icon" style="font-size:0.72rem;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:0.1em">REMINDERS</div>
    <div class="modal-title">Import ${count} item${count !== 1 ? 's' : ''}?</div>
    <div class="modal-body" style="text-align:left">${preview}${more}
      <div style="margin-top:10px;font-size:0.74rem;color:var(--text-dim)">Added to Personal tasks.</div>
    </div>
    <button class="modal-btn" onclick="confirmReminderImport()">Import</button>
    <button onclick="closeModal()" style="margin-top:8px;width:100%;background:none;border:none;color:var(--text-dim);font-size:0.8rem;cursor:pointer;font-family:'DM Sans',sans-serif">Cancel</button>
  `;
  document.getElementById('overlay').classList.add('show');
}

function confirmReminderImport() {
  if (!pendingReminderImport) return;
  pendingReminderImport.forEach(text => {
    S.tasks.unshift({ id: S.nextId++, text, cat: 'personal', done: false, createdAt: Date.now(), fromReminders: true });
    S.totalAdded++;
  });
  const count = pendingReminderImport.length;
  pendingReminderImport = null;
  save();
  closeModal();
  currentTab = 'quests';
  currentQuestCat = 'personal';
  render();
  showToast(`${count} tasks added from Reminders ✓`);
}

function pushToReminders(text) {
  if (!text || !text.trim()) return;
  window.location.href = `shortcuts://run-shortcut?name=Add%20to%20Reminders&input=${encodeURIComponent(text.trim())}`;
}

function completeInReminders(text) {
  window.location.href = `shortcuts://run-shortcut?name=Complete%20in%20Reminders&input=${encodeURIComponent(text.trim())}`;
}

// ── CALENDAR EVENTS BRIDGE ────────────────────────────────────
function checkCalEventsImport() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('calevents');
  if (!raw) return;
  try {
    const decoded = decodeURIComponent(raw);
    const lines = decoded.split('\n').filter(Boolean);
    const events = lines.map(line => {
      const pipeIdx = line.indexOf('|');
      if (pipeIdx === -1) return null;
      const time = line.slice(0, pipeIdx).trim();
      const title = line.slice(pipeIdx + 1).trim();
      return (time && title) ? { time, title } : null;
    }).filter(Boolean);
    if (events.length > 0) {
      S.todayCalEvents = events;
      save();
      window.history.replaceState({}, '', window.location.pathname);
      renderToday();
      showToast(`${events.length} event${events.length !== 1 ? 's' : ''} loaded from calendar`);
    }
  } catch(e) {
    console.error('Cal events import error:', e);
  }
}
